AWSTemplateFormatVersion: "2010-09-09"
Description: >
  re:Post Scout v2 - always-on agent (07:00 IST) that finds unanswered
  re:Post questions, drafts answer outlines with Bedrock Nova Lite, emails
  the brief via SNS, and archives every brief to DynamoDB. A read-only
  Lambda Function URL serves the archive to a static SPA on Amplify Hosting.

Parameters:
  RecipientEmail:
    Type: String
    Description: Where the daily brief lands (confirm one SNS subscription email after deploy)
  Topics:
    Type: String
    Default: "bedrock,fargate,cost optimization,cloudformation"
    Description: Comma-separated re:Post search terms (your lanes)
  ScheduleExpression:
    Type: String
    Default: "cron(30 1 * * ? *)"
    Description: 01:30 UTC = 07:00 IST daily
  ModelId:
    Type: String
    Default: "amazon.nova-lite-v1:0"
    Description: Bedrock model for ranking + drafting


Resources:

  BriefTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: repost-scout-brief
      Subscription:
        - Protocol: email
          Endpoint: !Ref RecipientEmail

  BriefsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: repost-scout-briefs
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: run_date
          AttributeType: S
      KeySchema:
        - AttributeName: run_date
          KeyType: HASH

  ScoutRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: repost-scout-lambda-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: repost-scout
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:*
              - Effect: Allow
                Action: bedrock:InvokeModel
                Resource: !Sub arn:aws:bedrock:${AWS::Region}::foundation-model/*
              - Effect: Allow
                Action: sns:Publish
                Resource: !Ref BriefTopic
              - Effect: Allow
                Action: dynamodb:PutItem
                Resource: !GetAtt BriefsTable.Arn

  ScoutFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: repost-scout
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt ScoutRole.Arn
      Timeout: 120
      MemorySize: 256
      Environment:
        Variables:
          TOPICS: !Ref Topics
          TOPIC_ARN: !Ref BriefTopic
          TABLE: !Ref BriefsTable
          MODEL_ID: !Ref ModelId
      Code:
        ZipFile: |
          import json, os, re, urllib.request, urllib.parse, datetime, boto3

          BR = boto3.client("bedrock-runtime")
          SNS = boto3.client("sns")
          DDB = boto3.client("dynamodb")
          UA = {"User-Agent": "Mozilla/5.0 (rePostScout personal agent)"}
          MODEL = os.environ.get("MODEL_ID", "amazon.nova-lite-v1:0")

          def get_questions(topic, limit=6):
              url = ("https://repost.aws/questions?view=unanswered&sort=recent&search="
                     + urllib.parse.quote(topic))
              try:
                  req = urllib.request.Request(url, headers=UA)
                  html = urllib.request.urlopen(req, timeout=20).read().decode("utf-8", "ignore")
              except Exception as e:
                  print(f"fetch failed for {topic}: {e}")
                  return []
              links = re.findall(r'href="(/questions/(QU[\w-]+)/([\w-]+))"', html)
              seen, out = set(), []
              for path, qid, slug in links:
                  if qid in seen:
                      continue
                  seen.add(qid)
                  title = slug.replace("-", " ").strip().capitalize()
                  out.append({"topic": topic, "title": title,
                              "url": "https://repost.aws" + path})
                  if len(out) >= limit:
                      break
              return out

          def draft_brief(cands):
              listing = "\n".join(f"{i+1}. [{c['topic']}] {c['title']} — {c['url']}"
                                  for i, c in enumerate(cands))
              prompt = f"""You are re:Post Scout, a daily agent for Vishnu, an AWS consultant
          (AWS Community Builder). His strong lanes: Amazon Bedrock (KBs, agents),
          ECS/Fargate ops and debugging, cost optimization (Trusted Advisor, Cost
          Optimization Hub), CloudFormation, serverless.

          Below are fresh UNANSWERED re:Post questions found today:
          {listing}

          Do this:
          1. Pick the 3 questions Vishnu is best placed to answer from hands-on
             experience. Skip vague, account-specific, or billing-support posts.
          2. For each pick, write:
             - WHY IT'S A FIT (1 line)
             - ANSWER OUTLINE: 3-5 bullets he can expand into an answer. Direct,
               experience-led voice. Short sentences. Concrete steps, exact console
               paths or CLI where useful. If something is uncertain, say "verify X"
               rather than inventing it. No fluff, no "great question".
          3. End with a one-line "skip list" naming what you rejected and why.

          Plain text only. Keep the whole brief under 450 words."""
              r = BR.converse(modelId=MODEL,
                              messages=[{"role": "user", "content": [{"text": prompt}]}],
                              inferenceConfig={"maxTokens": 1200, "temperature": 0.4})
              return r["output"]["message"]["content"][0]["text"]

          def handler(event, context):
              topics = [t.strip() for t in os.environ["TOPICS"].split(",") if t.strip()]
              cands = []
              for t in topics:
                  cands += get_questions(t)
              print(f"found {len(cands)} candidates")
              now = datetime.datetime.now(datetime.timezone.utc)
              today = now.date().isoformat()
              if not cands:
                  body = ("re:Post Scout ran but found no unanswered questions today "
                          "(or page parsing broke - check the logs).")
              else:
                  body = draft_brief(cands)
                  body += "\n\n---\nAll candidates found today:\n" + "\n".join(
                      f"- {c['title']}\n  {c['url']}" for c in cands)
              DDB.put_item(TableName=os.environ["TABLE"], Item={
                  "run_date": {"S": today},
                  "run_at_utc": {"S": now.isoformat(timespec="seconds")},
                  "candidates": {"N": str(len(cands))},
                  "brief": {"S": body[:35000]}})
              SNS.publish(
                  TopicArn=os.environ["TOPIC_ARN"],
                  Subject=f"re:Post Scout brief - {today}",
                  Message=body)
              return {"candidates": len(cands)}

  ArchiveRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: repost-scout-archive-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: read-briefs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:*
              - Effect: Allow
                Action: dynamodb:Scan
                Resource: !GetAtt BriefsTable.Arn

  ArchiveFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: repost-scout-archive
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt ArchiveRole.Arn
      Timeout: 10
      MemorySize: 128
      Environment:
        Variables:
          TABLE: !Ref BriefsTable
      Code:
        ZipFile: |
          import json, os, boto3
          DDB = boto3.client("dynamodb")

          def handler(event, context):
              items = []
              kwargs = {"TableName": os.environ["TABLE"]}
              while True:
                  r = DDB.scan(**kwargs)
                  items += r["Items"]
                  if "LastEvaluatedKey" not in r:
                      break
                  kwargs["ExclusiveStartKey"] = r["LastEvaluatedKey"]
              runs = sorted(
                  ({"run_date": i["run_date"]["S"],
                    "run_at_utc": i.get("run_at_utc", {}).get("S", ""),
                    "candidates": int(i.get("candidates", {}).get("N", "0")),
                    "brief": i.get("brief", {}).get("S", "")} for i in items),
                  key=lambda x: x["run_date"], reverse=True)
              return {"statusCode": 200,
                      "headers": {"Content-Type": "application/json"},
                      "body": json.dumps({"runs": runs})}

  ArchiveUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt ArchiveFunction.Arn
      AuthType: NONE
      Cors:
        AllowOrigins: ["*"]
        AllowMethods: ["GET"]

  ArchiveUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ArchiveFunction
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

  ArchiveUrlInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ArchiveFunction
      Action: lambda:InvokeFunction
      Principal: "*"
      InvokedViaFunctionUrl: true

  SchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: repost-scout-scheduler-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: scheduler.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: invoke-scout
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt ScoutFunction.Arn

  MorningSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: repost-scout-daily
      Description: Fires re:Post Scout at 07:00 IST every day
      ScheduleExpression: !Ref ScheduleExpression
      ScheduleExpressionTimezone: UTC
      FlexibleTimeWindow:
        Mode: "OFF"
      State: ENABLED
      Target:
        Arn: !GetAtt ScoutFunction.Arn
        RoleArn: !GetAtt SchedulerRole.Arn
        RetryPolicy:
          MaximumRetryAttempts: 2

Outputs:
  FunctionName:
    Value: !Ref ScoutFunction
  ArchiveApiUrl:
    Description: Paste this into API_URL at the top of index.html
    Value: !GetAtt ArchiveUrl.FunctionUrl
  TestCommand:
    Value: !Sub aws lambda invoke --function-name ${ScoutFunction} --region ${AWS::Region} /tmp/out.json
